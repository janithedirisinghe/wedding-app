apiVersion: apps/v1
kind: Deployment
metadata:
  name: wedding-app
  namespace: wedding-prod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: wedding-app
      tier: frontend
  template:
    metadata:
      labels:
        app: wedding-app
        tier: frontend
    spec:
      serviceAccountName: wedding-sa
      containers:
        - name: wedding-app
          image: 140023361098.dkr.ecr.us-east-1.amazonaws.com/wedding-app:v1
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: wedding-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wedding-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wedding-secret
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wedding-secret
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3